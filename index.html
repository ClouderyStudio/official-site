<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0053db" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1226" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="云术工作室 —— 创意与技术的完美结合。专注前后端开发与游戏服务，打造域名、统一认证、心理健康与游戏社区等数字产品。"
    />
    <meta name="keywords" content="云术工作室,Cloudery Studio,前后端开发,游戏服务,心理健康,辽阔域名" />
    <meta property="og:title" content="云术工作室" />
    <meta property="og:description" content="创意与技术的完美结合" />
    <meta property="og:type" content="website" />
    <title>云术工作室 —— 创意与技术的完美结合</title>
    <script>
      // Resolve the colour scheme before first paint so there is no light flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('cloudery-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* first paint falls back to the light scheme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
